name: Relatório Semanal GLPI

on:
  schedule:
    - cron: '0 12 * * 1'   # toda segunda-feira às 12h UTC = 09h Brasília
  workflow_dispatch:         # permite disparo manual se precisar

jobs:
  gerar-relatorio:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests reportlab

      - name: Gerar e enviar relatório
        env:
          GLPI_URL: ${{ secrets.GLPI_URL }}
          GLPI_APP_TOKEN: ${{ secrets.GLPI_APP_TOKEN }}
          GLPI_USER_TOKEN: ${{ secrets.GLPI_USER_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python relatorio_automatico.py
