name: Agente RecebeMais GLPI

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  verificar-chamados:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Restaurar ids_vistos
        uses: actions/cache@v4
        with:
          path: ids_vistos.json
          key: ids-vistos-${{ github.run_id }}
          restore-keys: |
            ids-vistos-

      - name: Executar agente
        env:
          GLPI_URL: ${{ secrets.GLPI_URL }}
          GLPI_APP_TOKEN: ${{ secrets.GLPI_APP_TOKEN }}
          GLPI_USER_TOKEN: ${{ secrets.GLPI_USER_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python agente_recebemais.py

      - name: Salvar ids_vistos
        uses: actions/cache/save@v4
        if: always()
        with:
          path: ids_vistos.json
          key: ids-vistos-${{ github.run_id }}
