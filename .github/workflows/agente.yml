name: Agente RecebeMais GLPI

on:
  # Disparo unico via cron-job.org (job "Agente GLPI"), que chama a API
  # workflow_dispatch a cada 5 min. O 'schedule:' nativo do GitHub foi
  # removido em 09/07/2026 para eliminar o disparo em dobro (o cron nativo
  # rodava junto com o cron-job.org). O cron-job.org e mais pontual que o
  # schedule nativo, que atrasa em repos com pouca atividade.
  workflow_dispatch:

jobs:
  verificar-chamados:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Restaurar ids_vistos
        uses: actions/cache@v4
        with:
          path: ids_vistos.json
          key: ids-vistos-${{ github.run_id }}
          restore-keys: |
            ids-vistos-

      - name: Executar agente
        env:
          GLPI_URL: ${{ secrets.GLPI_URL }}
          GLPI_APP_TOKEN: ${{ secrets.GLPI_APP_TOKEN }}
          GLPI_USER_TOKEN: ${{ secrets.GLPI_USER_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python agente_recebemais.py

      - name: Salvar ids_vistos
        uses: actions/cache/save@v4
        if: always()
        with:
          path: ids_vistos.json
          key: ids-vistos-${{ github.run_id }}
