name: Popular Base de Conhecimento GLPI

on:
  schedule:
    - cron: '0 */2 * * *'   # a cada 2 horas
  workflow_dispatch:

jobs:
  popular-kb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Restaurar artigos criados
        uses: actions/cache@v4
        with:
          path: kb_artigos_criados.json
          key: kb-artigos-${{ github.run_id }}
          restore-keys: |
            kb-artigos-

      - name: Popular base de conhecimento
        env:
          GLPI_URL: ${{ secrets.GLPI_URL }}
          GLPI_APP_TOKEN: ${{ secrets.GLPI_APP_TOKEN }}
          GLPI_USER_TOKEN: ${{ secrets.GLPI_USER_TOKEN }}
        run: python popular_base_conhecimento.py

      - name: Salvar artigos criados
        uses: actions/cache/save@v4
        if: always()
        with:
          path: kb_artigos_criados.json
          key: kb-artigos-${{ github.run_id }}
