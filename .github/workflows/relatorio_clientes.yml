name: Relatório Individual por Cliente GLPI

on:
  # Disparo via cron-job.org (workflow_dispatch) — dois jobs configurados:
  #   Semanal:  toda segunda-feira às 09h15 UTC  → body: {"ref":"main","inputs":{"modo":"semanal"}}
  #   Mensal:   todo dia 1º às 09h15 UTC          → body: {"ref":"main","inputs":{"modo":"mensal"}}
  # O 'schedule:' nativo foi omitido — repos com pouca atividade param de disparar.
  workflow_dispatch:
    inputs:
      modo:
        description: 'Período do relatório (semanal ou mensal)'
        required: false
        default: 'semanal'

jobs:
  gerar-relatorios:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests reportlab

      - name: Gerar e enviar relatórios individuais
        env:
          GLPI_URL: ${{ secrets.GLPI_URL }}
          GLPI_APP_TOKEN: ${{ secrets.GLPI_APP_TOKEN }}
          GLPI_USER_TOKEN: ${{ secrets.GLPI_USER_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODO: ${{ github.event.inputs.modo || 'semanal' }}
        run: python relatorio_clientes.py
