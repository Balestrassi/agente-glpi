name: Agente Reaberturas GLPI

on:
  schedule:
    - cron: '*/30 * * * *'   # a cada 30 minutos
  workflow_dispatch:

jobs:
  reaberturas:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Restaurar cache de reaberturas
        uses: actions/cache@v4
        with:
          path: reaberturas_cache.json
          key: reaberturas-${{ github.run_id }}
          restore-keys: |
            reaberturas-

      - name: Executar agente
        env:
          GLPI_URL: ${{ secrets.GLPI_URL }}
          GLPI_APP_TOKEN: ${{ secrets.GLPI_APP_TOKEN }}
          GLPI_USER_TOKEN: ${{ secrets.GLPI_USER_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python agente_reaberturas.py

      - name: Salvar cache de reaberturas
        uses: actions/cache/save@v4
        if: always()
        with:
          path: reaberturas_cache.json
          key: reaberturas-${{ github.run_id }}
