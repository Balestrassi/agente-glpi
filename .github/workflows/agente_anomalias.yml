name: Agente Detector de Anomalias

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  detectar-anomalias:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Restaurar estado de alertas
        uses: actions/cache@v4
        with:
          path: anomalias_alertadas.json
          key: anomalias-alertadas-${{ github.run_id }}
          restore-keys: |
            anomalias-alertadas-

      - name: Executar detector
        env:
          GLPI_URL: ${{ secrets.GLPI_URL }}
          GLPI_APP_TOKEN: ${{ secrets.GLPI_APP_TOKEN }}
          GLPI_USER_TOKEN: ${{ secrets.GLPI_USER_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python agente_anomalias.py

      - name: Salvar estado de alertas
        uses: actions/cache/save@v4
        if: always()
        with:
          path: anomalias_alertadas.json
          key: anomalias-alertadas-${{ github.run_id }}
